{{ define "main" }}
<!-- Full-width background header -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 400px;
  background-image: url('{{ with .Params.featureImage }}{{ . }}{{ end }}');
  background-size: cover;
  background-position: 30% 30%;
  z-index: -1;
  pointer-events: none;
">
  <div style="
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
  "></div>
</div>

<article class="prose dark:prose-invert max-w-none" style="padding-top: 320px;">
  <header style="position: relative; z-index: 1; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin-bottom: 2rem;">
    <h1 class="mt-0 text-4xl font-extrabold mb-2">{{ .Title }}</h1>
    <div class="text-sm opacity-90">
      {{ .Date.Format "02/01/2006" }} · {{ .WordCount }} words · {{ .ReadingTime }} min
    </div>
    {{ if .Params.tags }}
    <div class="flex flex-wrap gap-2 mt-3">
      {{ range .Params.tags }}
      <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" class="text-xs px-2 py-1 rounded border border-white/50 bg-black/40 text-white backdrop-blur-sm no-underline hover:bg-white/20">
        {{ . }}
      </a>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div>
    {{ .Content }}
  </div>
</article>
{{ end }}
