<div class="vimeo-responsive {{ if .Get "portrait" }}portrait{{ end }}{{ if eq (.Get "orientation") "portrait" }}portrait{{ end }}{{ if eq (.Get "orientation") "square" }}square{{ end }}" style="margin: 2rem 0;">
  <iframe src="https://player.vimeo.com/video/{{ if .Get "id" }}{{ .Get "id" }}{{ else }}{{ .Get 0 }}{{ end }}?responsive=1"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
  </iframe>
</div>

<style>
.vimeo-responsive {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  max-width: 1067px;
  margin: 2rem auto;
}

.vimeo-responsive iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.vimeo-responsive.portrait {
  padding-bottom: 177.78%;
  max-width: 450px;
  margin: 2rem auto;
}

.vimeo-responsive.square {
  padding-bottom: 100%;
  max-width: 600px;
  margin: 2rem auto;
}

@media (max-width: 768px) {
  .vimeo-responsive.portrait,
  .vimeo-responsive.square {
    max-width: 90%;
  }
}
</style>
